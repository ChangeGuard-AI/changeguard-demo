# demo-shop: a small web service. Two replicas, each asking for 100m CPU and
# 64Mi of memory.
#
# To propose a change, edit this file in a pull request. ChangeGuard reads the
# manifests a pull request touches and judges the object you proposed against
# the environment it would land in — so changing `replicas` below is a real
# proposed change, judged against the real namespace named here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-shop
  namespace: cg-demo
  labels:
    app: demo-shop
    purpose: golden-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-shop
  template:
    metadata:
      labels:
        app: demo-shop
        purpose: golden-demo
    spec:
      containers:
        - name: shop
          image: public.ecr.aws/nginx/nginx:1.27
          securityContext:
            runAsUser: 0
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
