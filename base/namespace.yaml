# The environment ChangeGuard judges changes against.
#
# This namespace exists and is running; the manifests beside this one describe
# what is in it. That is the point — a judgment is only as good as the match
# between what the repository says and what the cluster actually has.
apiVersion: v1
kind: Namespace
metadata:
  name: cg-demo
  labels:
    app.kubernetes.io/part-of: changeguard-demo
