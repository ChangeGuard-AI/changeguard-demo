# Proposed change: Scale demo-shop from 3 to 20 replicas
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-shop
  labels:
    app: demo-shop
spec:
  replicas: 20   # was 3
  selector:
    matchLabels:
      app: demo-shop
  template:
    metadata:
      labels:
        app: demo-shop
    spec:
      containers:
        - name: web
          image: public.ecr.aws/nginx/nginx:1.27
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 128Mi
